# Optional model routing for hosts that support per-agent model selection.
# Values are host-native model identifiers. Use `inherit` (the default) to
# let the host pick, or to inherit the orchestrator's model.
#
# Roles map to agents as follows:
#   summarizer  — pr-summarizer
#   reviewer    — code-reviewer, silent-failure-hunter, pr-test-analyzer,
#                 comment-analyzer, type-design-analyzer
#   specialist  — architecture-reviewer, security-reviewer, adversarial-general
#   hunter      — blind-hunter, edge-case-hunter
#   linker      — issue-linker
#
# Per-agent overrides (optional): uncomment and set a host-native name.
#   security-reviewer=my-strongest-model

summarizer=inherit
reviewer=inherit
specialist=inherit
hunter=inherit
linker=inherit
